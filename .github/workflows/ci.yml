name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  # Cuts a release for every push to main that changes something installable:
  # bumps package.json from the conventional commits since the last tag, tags it,
  # publishes a GitHub release, then points the Homebrew formula at the new tag.
  # Commits pushed here with GITHUB_TOKEN do not trigger another run.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm trusted publishing: the job proves its identity with an OIDC token, no NPM_TOKEN secret.
      id-token: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Each part (tag, GitHub release, npm, Homebrew formula) is checked on its own, so re-running a
      # release that failed half-way finishes the missing parts instead of reporting success.
      - name: Plan
        id: plan
        run: |
          plan="$(node scripts/release.mjs plan)"
          echo "$plan"
          release="$(node -p "JSON.parse(process.argv[1]).release" "$plan")"
          version="$(node -p "JSON.parse(process.argv[1]).version" "$plan")"
          tagged=false; github=false; npm_has=false; formula=false
          if [ "$release" = "true" ]; then
            git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null && tagged=true
            gh release view "v$version" >/dev/null 2>&1 && github=true
            npm view "claude-auto-proxy@$version" version >/dev/null 2>&1 && npm_has=true
            git fetch -q origin main
            git show origin/main:Formula/claude-auto-proxy.rb | grep -q "refs/tags/v$version.tar.gz" && formula=true
            echo "v$version: tag=$tagged github-release=$github npm=$npm_has formula=$formula"
            if [ "$tagged" = true ] && [ "$github" = true ] && [ "$npm_has" = true ] && [ "$formula" = true ]; then
              echo "v$version is fully released; nothing to do"
              release=false
            fi
          fi
          {
            echo "release=$release"
            echo "version=$version"
            echo "tagged=$tagged"
            echo "github=$github"
            echo "npm=$npm_has"
            echo "formula=$formula"
          } >> "$GITHUB_OUTPUT"

      - name: Tag
        if: steps.plan.outputs.release == 'true' && steps.plan.outputs.tagged != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.mjs set-version "$VERSION"
          if ! git diff --quiet -- package.json; then
            git add package.json
            git commit -m "chore(release): v$VERSION"
          fi
          git tag -a "v$VERSION" -m "v$VERSION"
          # One atomic push: main and the tag land together or not at all, so a re-run never finds one
          # without the other.
          git push --atomic origin HEAD:main "v$VERSION"

      - name: GitHub release
        if: steps.plan.outputs.release == 'true' && steps.plan.outputs.github != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md --verify-tag

      # Trusted publishing (npm package settings: GitHub Actions, choiyounggi/claude-auto-proxy, ci.yml)
      # needs npm 11.5.1 or later; Node 22's bundled npm is older. Runs before the formula so a
      # formula failure never holds back npm.
      - name: npm publish
        if: steps.plan.outputs.release == 'true' && steps.plan.outputs.npm != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          # On a re-run the checkout predates the release commit: set the version again.
          node scripts/release.mjs set-version "$VERSION"
          npm install -g npm@^11.5.1
          npm publish --access public
          git checkout -- package.json

      - name: Homebrew formula
        if: steps.plan.outputs.release == 'true' && steps.plan.outputs.formula != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Start from main as it is now (it holds the release commit, also on a re-run).
          git fetch -q origin main
          git checkout -q -B formula-update origin/main
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${VERSION}.tar.gz"
          # The archive can take a moment to become downloadable after the tag push.
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "$url" -o release.tar.gz; then break; fi
            [ "$attempt" = 6 ] && { echo "archive never became available: $url"; exit 1; }
            sleep 10
          done
          sha="$(sha256sum release.tar.gz | cut -d' ' -f1)"
          rm release.tar.gz
          node scripts/release.mjs formula "$VERSION" "$sha"
          if git diff --quiet -- Formula/claude-auto-proxy.rb; then
            echo "formula already points at v$VERSION"
            exit 0
          fi
          git add Formula/claude-auto-proxy.rb
          git commit -m "chore(release): update Homebrew formula for v$VERSION"
          git push origin HEAD:main
